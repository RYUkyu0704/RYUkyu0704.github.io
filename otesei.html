<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <style>
    /* 画面全体の設定（背景色と中央寄せ） */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f9; /* 背景色 */
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #333;
    }

    /* タイマー全体を囲む白いカード */
    .card {
      background-color: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
      color: #555;
      letter-spacing: 0.05em;
    }

    /* タイマーの文字（大きく強調） */
    #timerHyouji {
      font-size: 26px;
      font-weight: bold;
      color: #e74c3c; /* 集中カラー（赤系） */
      min-height: 40px;
      margin: 24px 0;
    }

    #souShuchu {
      font-size: 16px;
      color: #666;
      min-height: 24px;
      margin-bottom: 24px;
    }

    /* ボタン共通の見た目 */
    button {
      font-size: 16px;
      font-weight: bold;
      padding: 12px 24px;
      margin: 6px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    /* マウスを乗せたとき */
    button:hover {
      opacity: 0.85;
    }

    /* 押したときに少し沈む */
    button:active {
      transform: scale(0.96);
    }

    /* 開始・終了ボタンの色 */
    #start {
      background-color: #e74c3c;
      color: white;
    }

    /* 一時停止・再開ボタンの色 */
    #STOPtoLIS {
      background-color: #3498db;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍅 ポモドーロタイマー</h1>
    <p id="timerHyouji">準備OK！</p>
    <p id="souShuchu"></p>

    <div>
      <button id="start">開始しますよ</button>
      <button id="STOPtoLIS" style="display:none">STOP &amp; RESTART</button>
    </div>
  </div>

  <script src="bakkuappu.js"></script>
</body>
</html>
